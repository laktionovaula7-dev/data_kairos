<!doctype html>
<html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Продажи — функциональный прототип</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#292925;font:14px system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:24px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:20px 0 12px}h3{font-size:15px}p{line-height:1.5}.muted,small{color:#73736b}button,select,input{font:inherit;color:inherit;background:white;border:1px solid #d8d8cf;border-radius:8px;padding:9px}button{cursor:pointer}button:hover{background:#f4ece2}button.active,button.primary{background:#30332d;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #cc7c38;outline-offset:2px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.spread{justify-content:space-between}.panel{background:white;border:1px solid #e4e2da;border-radius:14px;padding:18px;margin:16px 0}.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}label{display:grid;gap:5px;font-size:12px}label.check{display:flex;align-items:center;font-size:14px}.tabs{margin:20px 0}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:18px;margin:20px 0}.value{font-size:23px;font-weight:700;margin-top:5px}.split{display:grid;grid-template-columns:1fr 1.4fr;gap:24px}.barrow{display:grid;grid-template-columns:minmax(140px,1fr) 2fr 115px;align-items:center;gap:12px;margin:10px 0}.track{height:12px;background:#f1f0ea;border-radius:8px;overflow:hidden}.fill{height:100%;background:#da954d}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:11px 8px;border-bottom:1px solid #ecebe5;text-align:left}th{color:#777;font-weight:500}td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}.link{border:0;background:none;padding:0;text-align:left;color:#895021;text-decoration:underline}.notice{background:#edece4;padding:12px;border-radius:8px;font-size:13px}.badge{display:inline-block;background:#f0eee7;border-radius:5px;padding:4px 7px}.abc{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.abc button{text-align:left;padding:18px}.abc strong{display:block;font-size:22px;margin:8px 0}.territory{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;align-content:start}.territory button{min-height:95px;text-align:left}.territory strong{display:block;margin:8px 0}.chips{margin-top:12px}.pill{border-radius:30px}.product{position:relative;border-radius:25px;background:#f6f4ed;margin:8px 0;overflow:hidden}.product .shade{position:absolute;inset:0 auto 0 0;background:#fae3be}.product button{position:relative;width:100%;background:none;border:0;display:flex;justify-content:space-between;gap:14px;text-align:left;padding:13px}.product b{white-space:nowrap}dialog{border:1px solid #d8d8cf;border-radius:14px;max-width:740px;width:calc(100% - 30px);max-height:90vh;padding:24px}dialog::backdrop{background:#0006}.warehouse{display:flex;gap:16px;flex-wrap:wrap;margin:14px 0}textarea{width:100%;min-height:110px;font:inherit;padding:12px}.caption{font-size:12px;color:#777}.scenario{margin:16px 0}#message{margin:10px 0;color:#805121}footer{padding:24px 0;color:#777}.blank{padding:30px 0} @media(max-width:850px){.split{grid-template-columns:1fr}.abc{grid-template-columns:1fr}main{padding:14px}.barrow{grid-template-columns:1fr 1fr 95px}}
</style>
<main id="app"></main><dialog id="exportDialog"></dialog>
<script>
'use strict';
const WH=['Москва — основной','Юг — основной','Сибирь — основной'];
const places=[
{branch:'Москва',region:'Центральный ФО',city:'Москва',manager:'Анна Смирнова'},
{branch:'Москва',region:'Центральный ФО',city:'Тула',manager:'Анна Смирнова'},
{branch:'Юг',region:'Южный ФО',city:'Краснодар',manager:'Иван Петров'},
{branch:'Юг',region:'Южный ФО',city:'Ростов-на-Дону',manager:'Иван Петров'},
{branch:'Москва',region:'Сибирский ФО',city:'Новосибирск',manager:'Ольга Белова'},
{branch:'Москва',region:'Сибирский ФО',city:'Омск',manager:'Ольга Белова'}];
const clients=places.flatMap((p,i)=>[0,1].map(j=>({...p,id:'C'+(i*2+j),client:i===0&&j===0?'Каченко Екатерина Викторовна':['Строймаркет','Дом ремонта'][j]+' · '+p.city})));
const products=Array.from({length:24},(_,i)=>({id:'P'+i,sku:'DEMO-'+String(i+1).padStart(3,'0'),brand:['KRONbuild','ENKI','HeadRock'][i%3],category:['Пены','Герметики','Клеи','Краски'][Math.floor(i/6)],name:['Пена профессиональная','Герметик силиконовый','Клей монтажный','Краска аэрозольная'][Math.floor(i/6)]+' '+['KRONbuild','ENKI','HeadRock'][i%3]+' '+(i+1),price:Math.round(900/(1+i*.12)),stock:WH.map((_,w)=>(i+w)%5===0?0:((i+3)*(w+4)*17)%750)}));
const orders=[];
for(let month=1;month<=9;month++)for(const [ci,c] of clients.entries())for(const [pi,p] of products.entries()){
if((pi+ci*3)%7>3 || pi===23 || (ci===0&&pi%3===1) || (month>=7&&ci===0&&pi===3))continue;
const qty=Math.max(1,Math.round((25-pi)*(1+ci%3)*(1+month/18)));
orders.push({...c,product:p.id,brand:p.brand,category:p.category,month,qty,revenue:qty*p.price,orderId:'D-'+month+'-'+ci+'-'+Math.floor(pi/5)});
}
const labels={branch:'Филиал',region:'Регион',city:'Город',manager:'Менеджер',client:'Клиент',brand:'Бренд',category:'Категория',product:'Товар'};
const empty=()=>Object.fromEntries(Object.keys(labels).map(k=>[k,'']));
let state={period:'q3',...empty(),tab:'sales',group:'region',abc:'',buy:'all',available:false,warehouses:[...WH],search:'',sort:'revenue',direction:-1,base:'company'};
let history=[],exportMode='current',exportWH=[...WH],exportSearch='';
const fmt=n=>Math.round(n).toLocaleString('ru-RU'),money=n=>fmt(n)+' ₽',pct=n=>(n*100).toLocaleString('ru-RU',{maximumFractionDigits:1})+'%';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function inPeriod(o,period=state.period){return period==='all'||(period==='q3'?o.month>=7:o.month>=4&&o.month<=6)}
function sales(s=state){return orders.filter(o=>inPeriod(o,s.period)&&Object.keys(labels).every(k=>!s[k]||o[k]===s[k]));}
function sum(rows,key='revenue'){return rows.reduce((a,r)=>a+r[key],0)}
function abcMap(rows,universe=products){
let vals=universe.map(p=>({id:p.id,value:sum(rows.filter(o=>o.product===p.id))})).filter(x=>x.value>0).sort((a,b)=>b.value-a.value||a.id.localeCompare(b.id));
let total=sum(vals,'value'),acc=0,map={};for(const v of vals){let before=acc/total;acc+=v.value;map[v.id]={abc:before<.8?'A':before<.95?'B':'C',share:v.value/total,cumulative:acc/total};}return map;
}
function stock(p,wh=state.warehouses){return WH.reduce((a,w,i)=>a+(wh.includes(w)?p.stock[i]:0),0)}
function periodStart(s=state){return s.period==='q3'?7:s.period==='q2'?4:1}
function statusLabel(p,s=state){return p.bought?'Берёт':s.client?(p.hadBefore?'Брал раньше, сейчас не берёт':periodStart(s)===1?'Нет покупок за доступную историю':'Не брал за доступную историю'):'Не продаётся в выбранном срезе'}
function historyCaption(s=state){return s.period==='q3'?'Ранее: январь — июнь 2026; сейчас: июль — сентябрь 2026':s.period==='q2'?'Ранее: январь — март 2026; сейчас: апрель — июнь 2026':'История начинается в январе 2026; данных до выбранного периода нет'}
function model(s=state,wh=s.warehouses,full=false){
const ss=full?{...s,...empty(),abc:'',buy:'all',available:false,search:'',base:'company'}:s;
const rows=sales(ss),allRows=orders.filter(o=>inPeriod(o,ss.period));
const company=abcMap(allRows),base=ss.base==='brand'&&ss.brand?abcMap(allRows.filter(o=>o.brand===ss.brand),products.filter(p=>p.brand===ss.brand)):company,local=abcMap(rows);
return products.filter(p=>(!ss.brand||p.brand===ss.brand)&&(!ss.category||p.category===ss.category)&&(!ss.product||p.id===ss.product)).map(p=>{let r=rows.filter(o=>o.product===p.id);let past=ss.client?orders.filter(o=>o.client===ss.client&&o.product===p.id&&o.month<periodStart(ss)):[];let companyRevenue=sum(allRows.filter(o=>o.product===p.id));return {...p,revenue:sum(r),qty:sum(r,'qty'),bought:r.length>0,hadBefore:past.length>0,lastBefore:past.length?Math.max(...past.map(o=>o.month)):null,companyRevenue,companyPercent:sum(allRows)?100*companyRevenue/sum(allRows):0,company:company[p.id]?.abc||'—',abc:base[p.id]?.abc||'—',local:local[p.id]?.abc||'—',share:base[p.id]?.share||0,cumulative:base[p.id]?.cumulative||0,balance:stock(p,wh)};}).filter(p=>(!ss.abc||p.abc===ss.abc)&&(ss.buy==='all'||(ss.buy==='yes'?p.bought:ss.buy==='no'?!p.bought:ss.buy==='stopped'?!p.bought&&p.hadBefore:!p.bought&&!p.hadBefore))&&(!ss.available||p.balance>0)&&(!ss.search||(p.name+' '+p.sku).toLowerCase().includes(ss.search.toLowerCase()))).sort((a,b)=>ss.direction*(typeof a[ss.sort]==='number'?a[ss.sort]-b[ss.sort]:String(a[ss.sort]).localeCompare(String(b[ss.sort]))));
}
function groups(rows,key){return [...new Set(rows.map(r=>r[key]))].map(name=>({name,revenue:sum(rows.filter(r=>r[key]===name)),clients:new Set(rows.filter(r=>r[key]===name).map(r=>r.client)).size})).sort((a,b)=>b.revenue-a.revenue)}
function options(k){
if(['brand','category','product'].includes(k))return products.filter(p=>(k==='brand'||!state.brand||p.brand===state.brand)&&(k!=='product'||!state.category||p.category===state.category)).map(p=>[k==='product'?p.id:p[k],k==='product'?p.name:p[k]]);
let parents={branch:[],region:['branch'],city:['branch','region'],manager:['branch','region','city'],client:['branch','region','city','manager']}[k];
return clients.filter(c=>parents.every(p=>!state[p]||c[p]===state[p])).map(c=>[c[k],c[k]]);
}
function setFilter(k,v){state[k]=v;let cleared=[];for(const key of ['region','city','manager','client','product'])if(state[key]&&!options(key).some(([x])=>x===state[key])){state[key]='';cleared.push(labels[key])}if(!state.brand)state.base='company';if(!state.client&&['stopped','never'].includes(state.buy))state.buy='all';render();if(cleared.length)document.getElementById('message').textContent='Сброшены несовместимые фильтры: '+cleared.join(', ')}
function select(k,title,opts,value){return '<label>'+title+'<select data-select="'+k+'">'+opts.map(([v,t])=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(t)+'</option>').join('')+'</select></label>'}
function btn(text,action,value='',active=false){return '<button data-action="'+action+'" data-value="'+esc(value)+'" class="'+(active?'active':'')+'">'+text+'</button>'}
function bar(name,value,max,action,key){return '<div class="barrow"><button class="link" data-action="'+action+'" data-value="'+esc(key||name)+'">'+esc(name)+'</button><div class="track"><div class="fill" style="width:'+(max?100*value/max:0)+'%"></div></div><b class="num">'+money(value)+'</b></div>'}
function render(){
const rows=sales(),total=sum(rows),m=model(state.tab==='sales'?{...state,abc:'',buy:'all',available:false,search:''}:state),isSlice=!!(state.branch||state.region||state.city||state.manager||state.client);
let content='<header class="row spread"><div><h1>Продажи</h1><p class="muted">Функциональный прототип · демонстрационные данные · 2026</p></div>'+btn('Как проверить','help')+'</header><div class="notice">Все товары, продажи, клиенты и остатки здесь — учебный набор. Проверяем поведение, а не показатели компании.</div>';
content+='<div class="row scenario">'+btn('Вся компания','scenario','all')+btn('KRONbuild → Юг','scenario','south')+btn('Клиент → что не берёт','scenario','client')+(history.length?btn('← Вернуться к предыдущему срезу','back'):'')+'</div>';
content+='<section class="panel"><div class="filters">'+select('period','Период',[['q3','Июль — сентябрь 2026'],['q2','Апрель — июнь 2026'],['all','Январь — сентябрь 2026']],state.period);
for(const [k,title]of Object.entries(labels))content+=select(k,title,[['','Все'],...new Map(options(k)).entries()],state[k]);
content+='</div><div class="row chips">'+Object.keys(labels).filter(k=>state[k]).map(k=>btn(esc(labels[k]+': '+(k==='product'?products.find(p=>p.id===state[k])?.name:state[k]))+' ×','clear',k)).join('')+btn('Сбросить фильтры','reset')+'</div><div id="message" aria-live="polite"></div></section>';
content+='<nav class="row tabs" aria-label="Раздел продаж">'+btn('Результаты продаж','tab','sales',state.tab==='sales')+btn('Ассортимент и ABC','tab','abc',state.tab==='abc')+'</nav>';
if(state.client||state.manager)content+='<h2>'+esc(state.client?'Клиент: '+state.client:'Менеджер: '+state.manager)+'</h2><p class="muted">Детальный срез · все общие фильтры сохранены</p>';
if(state.tab==='sales'){
let orderCount=new Set(rows.map(r=>r.orderId)).size;
content+='<div class="kpis">'+[['Продажи',money(total)],['Активные клиенты',new Set(rows.map(r=>r.client)).size],['Заказы',orderCount],['Средний заказ',orderCount?money(total/orderCount):'—'],['Количество, шт.',fmt(sum(rows,'qty'))],['Проданных SKU',new Set(rows.map(r=>r.product)).size]].map(([k,v])=>'<div><div class="muted">'+k+'</div><div class="value">'+v+'</div></div>').join('')+'</div>';
content+='<section class="panel"><h2>Продажи по месяцам, ₽</h2>'+[...new Set(orders.filter(o=>inPeriod(o)).map(o=>o.month))].map(n=>{let v=sum(rows.filter(o=>o.month===n));return bar(['','Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь'][n],v,Math.max(...Array.from({length:9},(_,i)=>sum(rows.filter(o=>o.month===i+1)))),'month',String(n))}).join('')+'<p class="caption">Учебные продажи 2026 · сравнение с прошлым годом не задано.</p></section>';
let geoKey=state.region?'city':'region',geo=[...new Set(clients.filter(c=>!state.branch||c.branch===state.branch).filter(c=>!state.region||c.region===state.region).map(c=>c[geoKey]))];
content+='<section class="panel"><h2>География · '+(geoKey==='city'?'города':'регионы')+'</h2><div class="split"><div>'+geo.map(n=>bar(n,sum(rows.filter(o=>o[geoKey]===n)),total,'geo',n)).join('')+'</div><div><p class="caption">Схема территорий (не географическая карта). Нажмите территорию для детализации.</p><div class="territory">'+geo.map(n=>'<button data-action="geo" data-value="'+esc(n)+'">'+esc(n)+'<strong>'+money(sum(rows.filter(o=>o[geoKey]===n)))+'</strong>'+new Set(rows.filter(o=>o[geoKey]===n).map(o=>o.client)).size+' активных клиентов</button>').join('')+'</div></div></div></section>';
let cats=groups(rows,'category'),top=m.filter(p=>p.revenue>0).slice().sort((a,b)=>b.revenue-a.revenue).slice(0,10);
content+='<section class="panel split"><div><h2>Категории · доля выручки</h2>'+cats.map(c=>bar(c.name+' · '+pct(total?c.revenue/total:0),c.revenue,total,'category',c.name)).join('')+'</div><div><h2>Топ-10 товаров · выручка</h2>'+top.map((p,i)=>'<div class="product"><div class="shade" style="width:'+(p.revenue/top[0].revenue*100)+'%"></div><button data-action="product" data-value="'+p.id+'"><span>'+(i+1)+'. '+esc(p.name)+'</span><b>'+money(p.revenue)+'</b></button></div>').join('')+'</div></section>';
content+='<section class="panel"><h2>Детализация продаж</h2><div class="row">'+['region','city','brand','product','manager','client'].map(k=>btn(labels[k],'group',k,state.group===k)).join('')+'</div><div class="tablewrap"><table><tr><th>'+labels[state.group]+'</th><th class="num">Продажи, ₽</th><th class="num">Доля выборки</th><th class="num">Клиенты</th></tr>'+groups(rows,state.group).map(g=>'<tr><td><button class="link" data-action="drill" data-value="'+esc(g.name)+'">'+esc(state.group==='product'?products.find(p=>p.id===g.name).name:g.name)+'</button></td><td class="num">'+fmt(g.revenue)+'</td><td class="num">'+pct(total?g.revenue/total:0)+'</td><td class="num">'+g.clients+'</td></tr>').join('')+'</table></div></section>';
}else{
let baseModel=model({...state,abc:'',buy:'all',available:false,search:''});
content+='<section class="row spread"><div><h2>ABC и ассортимент</h2><p class="muted">База: '+(state.base==='brand'?'выбранный бренд':'вся компания')+' за выбранный период. Регион не меняет базовый класс.</p></div><div class="row">'+btn('Скачать текущую выборку','export','current')+btn('Скачать полный ABC','export','full')+'</div></section>';
content+='<div class="row">'+select('base','База ABC',[['company','Компания'],...(state.brand?[['brand','Внутри выбранного бренда']]:[])],state.base)+'<span class="caption">Учебное правило: выручка, накопительная доля 80% / 95%. Пересекающий порог товар остаётся в предыдущем классе.</span></div>';
content+='<div class="abc">'+['A','B','C'].map(a=>{let ps=baseModel.filter(p=>p.abc===a),b=ps.filter(p=>p.bought).length;return '<button data-action="abc" data-value="'+a+'" class="'+(state.abc===a?'active':'')+'">Категория '+a+'<strong>'+(isSlice?b+' / '+ps.length:ps.length+' SKU')+'</strong>'+(isSlice?'Берёт / база · '+pct(ps.length?b/ps.length:0)+'<br>Не берёт: '+(ps.length-b):'Продажи: '+money(sum(ps)))+'</button>'}).join('')+'</div><p class="caption">В демо вся матрица применима ко всем клиентам. Товары без продаж компании имеют класс «—».</p>';
if(isSlice){let gaps=baseModel.filter(p=>p.abc==='A'&&!p.bought);content+='<div class="row">'+btn('Пробелы A: '+gaps.length+' SKU · в наличии '+gaps.filter(p=>p.balance>0).length,'gaps')+'</div>'}
content+='<section class="panel"><h2>Весь ассортимент: что берёт и что не берёт</h2><p class="caption">ABC компании — по всем продажам компании; ABC по фильтрам — внутри выбранного среза. Доля товара = продажи этого товара по всей компании / все продажи компании за тот же период. География и клиент её не меняют.</p>'+ (state.client?'<p class="notice">'+historyCaption()+'. «Брал раньше» означает наличие покупок до начала периода и отсутствие покупок в выбранном периоде; это не прогноз потери клиента.</p>':'')+'<div class="row">'+select('abc','Класс ABC',[['','Все'],['A','A'],['B','B'],['C','C'],['—','Без класса']],state.abc)+select('buy','Покупки',[['all','Все товары'],['yes','Берёт / продаётся'],['no','Все без покупок сейчас'],...(state.client?[['stopped','Брал раньше, сейчас не берёт'],['never','Не брал за доступную историю']]:[])],state.buy)+select('sort','Сортировать по',[['revenue','Продажам'],['balance','Наличию'],['name','Названию']],state.sort)+btn(state.direction===-1?'По убыванию ↓':'По возрастанию ↑','direction')+'<label>Поиск<input id="search" value="'+esc(state.search)+'" placeholder="Название или артикул"></label><label class="check"><input type="checkbox" id="available" '+(state.available?'checked':'')+'>Только в наличии</label></div><div class="warehouse">Наличие: '+WH.map(w=>'<label class="check"><input type="checkbox" data-wh="'+esc(w)+'" '+(state.warehouses.includes(w)?'checked':'')+'>'+esc(w)+'</label>').join('')+'</div><p class="caption">'+m.length+' SKU · '+money(sum(m))+' · наличие '+fmt(sum(m,'balance'))+' шт. на выбранных складах</p><div class="tablewrap"><table><tr><th>Товар / артикул</th><th>'+ (state.base==='brand'?'ABC бренда':'ABC компании')+'</th><th>ABC по фильтрам</th><th>Покупки</th><th class="num">Доля товара в продажах компании, %</th><th class="num">Продажи по фильтрам, ₽</th><th class="num">Шт.</th><th class="num">Наличие, шт.</th></tr>'+m.map(p=>'<tr><td>'+esc(p.name)+'<br><small>'+p.sku+'</small></td><td>'+p.abc+'</td><td>'+p.l function xml(s){return String(s).replace(/[<>&"']/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&apos;'}[c]))}
function zip(files){
const enc=new TextEncoder(),parts=[],central=[];let offset=0;
const crc=b=>{let c=0xffffffff;for(const v of b){c^=v;for(let i=0;i<8;i++)c=(c>>>1)^((c&1)?0xedb88320:0)}return(c^0xffffffff)>>>0};
const pack=(size,entries)=>{let b=new Uint8Array(size),d=new DataView(b.buffer);for(const [at,v,n]of entries)n===2?d.setUint16(at,v,true):d.setUint32(at,v,true);return b};
for(const [name,txt]of Object.entries(files)){let n=enc.encode(name),b=enc.encode(txt),c=crc(b),h=pack(30,[[0,0x04034b50,4],[4,20,2],[14,c,4],[18,b.length,4],[22,b.length,4],[26,n.length,2]]);parts.push(h,n,b);central.push(pack(46,[[0,0x02014b50,4],[4,20,2],[6,20,2],[16,c,4],[20,b.length,4],[24,b.length,4],[28,n.length,2],[42,offset,4]]),n);offset+=30+n.length+b.length}
let size=central.reduce((a,b)=>a+b.length,0),end=pack(22,[[0,0x06054b50,4],[8,Object.keys(files).length,2],[10,Object.keys(files).length,2],[12,size,4],[16,offset,4]]);
let out=new Uint8Array(offset+size+22),p=0;for(const b of [...parts,...central,end]){out.set(b,p);p+=b.length}return out;
}
function workbook(sheets){
const ns='http://schemas.openxmlformats.org/spreadsheetml/2006/main';
const files={'[Content_Types].xml':'<?xml version="1.0" encoding="UTF-8"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((_,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'</Types>',
'_rels/.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
'xl/workbook.xml':'<workbook xmlns="'+ns+'" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+sheets.map((s,i)=>'<sheet name="'+xml(s.name)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>',
'xl/_rels/workbook.xml.rels':'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((_,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'</Relationships>'};
const col=i=>{let s='';for(i++;i;i=Math.floor((i-1)/26))s=String.fromCharCode(65+(i-1)%26)+s;return s};
sheets.forEach((s,i)=>files['xl/worksheets/sheet'+(i+1)+'.xml']='<worksheet xmlns="'+ns+'"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><sheetData>'+s.rows.map((r,ri)=>'<row r="'+(ri+1)+'">'+r.map((v,ci)=>'<c r="'+col(ci)+(ri+1)+'"'+(typeof v==='number'?'><v>'+v+'</v>':' t="inlineStr"><is><t xml:space="preserve">'+xml(v??'')+'</t></is>')+'</c>').join('')+'</row>').join('')+'</sheetData><autoFilter ref="A1:'+col(s.rows[0].length-1)+s.rows.length+'"/></worksheet>');
return zip(files);
}

const full=exportMode==='full',ms=model(state,exportWH,full),ss=full?{...state,...empty()}:state,rs=sales(ss).filter(o=>ms.some(p=>p.id===o.product));
return workbook([
{name:'Параметры',rows:[['Параметр','Значение'],['Данные','Демонстрационные, не реальные'],['Период',state.period],['Режим',exportMode],['История покупок',historyCaption()],['Доля товара компании','Продажи товара по всей компании / вся выручка компании за период * 100'],['Склады',exportWH.join('; ')],['Остатки на','30.09.2026'],['База ABC',full?'Компания':state.base],['ABC правило','Выручка; 80% / 95%; пересекающая порог позиция в предыдущем классе'],...Object.keys(labels).map(k=>[labels[k],full?'Все':state[k]||'Все']),['Фильтры таблицы',full?'Сброшены':JSON.stringify({abc:state.abc,buy:state.buy,available:state.available,search:state.search})]]},
{name:'Сводка ABC',rows:[[full||state.base==='company'?'ABC компании':'ABC бренда','SKU','Берёт','Не берёт','Продажи, ₽','Наличие на выбранных складах, шт.'],...['A','B','C','—'].map(a=>{let ps=ms.filter(p=>p.abc===a);return[a,ps.length,ps.filter(p=>p.bought).length,ps.filter(p=>!p.bought).length,sum(ps),sum(ps,'balance')]})]},
{name:'Ассортимент',rows:[['Артикул','Товар','Бренд','Категория','ABC компании',full||state.base==='company'?'ABC компании (база)':'ABC бренда','ABC по фильтрам','Доля базы','Накопленная доля базы','Статус','Продажи, ₽','Количество, шт.','Доля товара в продажах компании, %','Продажи товара по компании, ₽','Брал до периода','Последняя покупка до периода (месяц 2026)',...exportWH,'Итого наличие, шт.'],...ms.map(p=>[p.sku,p.name,p.brand,p.category,p.company,p.abc,p.local,p.share,p.cumulative,statusLabel(p,ss),p.revenue,p.qty,p.companyPercent,p.companyRevenue,p.hadBefore?'Да':'Нет',p.lastBefore||'',...exportWH.map(w=>p.stock[WH.indexOf(w)]),p.balance])]},
{name:'Наличие по складам',rows:[['Артикул','Склад','Наличие','Единица','Дата среза'],...ms.flatMap(p=>exportWH.map(w=>[p.sku,w,p.stock[WH.indexOf(w)],'шт.','30.09.2026']))]},
{name:'Продажи',rows:[['Заказ','Месяц 2026','Филиал','Регион','Город','Менеджер','Клиент','SKU','Количество, шт.','Выручка, ₽'],...rs.map(o=>[o.orderId,o.month,o.branch,o.region,o.city,o.manager,o.client,products.find(p=>p.id===o.product).sku,o.qty,o.revenue])]}
]);
}
if(typeof document!=='undefined'){
document.addEventListener('click',e=>{
let b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,v=b.dataset.value;
if(a==='tab'){state.tab=v;render()}
else if(a==='reset'){Object.assign(state,empty());state.base='company';localReset();render()}
else if(a==='clear')setFilter(v,'');
else if(a==='group'){state.group=v;render()}
else if(a==='direction'){state.direction*=-1;render()}
else if(a==='abc'){state.abc=state.abc===v?'':v;render()}
else if(a==='gaps'){state.abc='A';state.buy='no';render()}
else if(a==='localReset'){localReset();render()}
else if(a==='geo'){snapshot();setFilter(state.region?'city':'region',v)}
else if(['category','product','drill'].includes(a)){snapshot();setFilter(a==='drill'?state.group:a,v);if(a==='drill'&&['manager','client'].includes(state.group)){state.tab='abc';localReset();render()}}
else if(a==='back'){if(history.length){state=history.pop();render()}}
else if(a==='scenario'){snapshot();Object.assign(state,empty());localReset();state.base='company';state.warehouses=[...WH];if(v==='south'){state.brand='KRONbuild';state.region='Южный ФО';state.tab='sales'}else if(v==='client'){state.client=clients[0].client;state.tab='abc'}else state.tab='sales';render()}
else if(a==='export'){exportMode=v;exportWH=[...state.warehouses];exportSearch='';exportRender();document.getElementById('exportDialog').showModal()}
else if(a==='closeExport')document.getElementById('exportDialog').close();
else if(a==='allWH'||a==='noneWH'){exportWH=a==='allWH'?[...WH]:[];exportRender()}
else if(a==='download'){try{const bytes=makeExport(),url=URL.createObjectURL(new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})),link=document.createElement('a');link.href=url;link.download='ABC-demo-'+exportMode+'.xlsx';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);document.getElementById('exportStatus').textContent='Файл сформирован. Проверьте загрузки браузера.'}catch(err){document.getElementById('exportStatus').textContent='Не удалось сформировать файл: '+err.message}}
else if(a==='help'){alert('1. Выберите KRONbuild → Юг и нажмите город.\n2. Перейдите в ABC: фильтры сохраняются.\n3. Откройте сценарий клиента, сравните Берёт / Не берёт.\n4. Выберите склады и сортировку по остаткам.\n5. Скачайте выборку или полный ABC: проверьте разные склады.\n6. В детализации продаж нажмите менеджера или клиента, затем Вернуться.\n\nКарта здесь заменена схемой территорий. План и сравнение с прошлым годом не моделируются.')}
else if(a==='month'){document.getElementById('message').textContent='Выбран '+v+'-й месяц: '+money(sum(sales().filter(o=>o.month===Number(v))))+'. Общий период не изменён.'}
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.select){const k=t.dataset.select;if(k in labels)setFilter(k,t.value);else{state[k]=t.value;render()}}else if(t.id==='available'){state.available=t.checked;render()}else if(t.dataset.wh){state.warehouses=t.checked?[...state.warehouses,t.dataset.wh]:state.warehouses.filter(w=>w!==t.dataset.wh);render()}else if(t.dataset.exportWh){exportWH=t.checked?[...exportWH,t.dataset.exportWh]:exportWH.filter(w=>w!==t.dataset.exportWh);exportRender()}});
document.addEventListener('input',e=>{let t=e.target;if(t.id==='search'){let pos=t.selectionStart;state.search=t.value;render();const s=document.getElementById('search');s.focus();s.setSelectionRange(pos,pos)}else if(t.id==='warehouseSearch'){let pos=t.selectionStart;exportSearch=t.value;exportRender();const s=document.getElementById('warehouseSearch');s.focus();s.setSelectionRange(pos,pos)}});
render();
}
